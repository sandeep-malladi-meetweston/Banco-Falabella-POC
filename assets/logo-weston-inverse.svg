<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 127 38" role="img" aria-label="Weston">
  <!-- The inverse cut, for the dark green chrome. The tile lifts to the brighter
       green so it still reads against the deep-green chrome, and the wordmark goes white. -->
  <defs>
    <style>
      .wmk-tile { fill: #007a33; }
      .wmk-stroke-a { fill: none; stroke: #ffffff; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .wmk-stroke-b { fill: none; stroke: #c3d600; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .wmk-word { fill: #ffffff; font-family: Archivo, "Segoe UI", Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; }
    </style>
  </defs>
  <rect class="wmk-tile" x="0" y="4" width="30" height="30" rx="8"/>
  <path class="wmk-stroke-a" d="M7.8 12 L11.4 26 L15 17.2"/>
  <path class="wmk-stroke-b" d="M15 17.2 L18.6 26 L22.2 12"/>
  <text class="wmk-word" x="38" y="27" textLength="87" lengthAdjust="spacingAndGlyphs">Weston</text>
</svg>
